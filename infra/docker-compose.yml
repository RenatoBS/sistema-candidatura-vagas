services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scv-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD deve ser definida no .env}
      SCV_APP_DB_PASSWORD: ${SCV_APP_DB_PASSWORD:?SCV_APP_DB_PASSWORD deve ser definida no .env}
      POSTGRES_DB: ${POSTGRES_DB:-scv}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Cria o papel scv_app (runtime, sem BYPASSRLS) na primeira inicialização do volume.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-scv} -d ${POSTGRES_DB:-scv}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: scv-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # As imagens oficiais minio/minio e quay.io/minio/minio deixaram de ser publicadas; usamos o fork
  # mantido pgsty/minio, fixado por versão (nunca :latest). Ver docs/runbooks/ambiente-local.md.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: scv-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER deve ser definida no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD deve ser definida no .env}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      # A imagem oficial do MinIO não inclui curl; usar o mc embutido
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Cria o bucket de desenvolvimento (idempotente) e termina.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: scv-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER deve ser definida no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD deve ser definida no .env}
      S3_BUCKET: ${S3_BUCKET:-scv-dev}
    entrypoint: ['/bin/sh', '-c']
    command:
      - mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing "local/$$S3_BUCKET"

  livekit:
    image: livekit/livekit-server:v1.9.0
    container_name: scv-livekit
    command: --dev --bind 0.0.0.0
    ports:
      - '${LIVEKIT_PORT:-7880}:7880'
      - '${LIVEKIT_RTC_TCP_PORT:-7881}:7881'
      - '${LIVEKIT_RTC_UDP_PORT:-7882}:7882/udp'
    environment:
      LIVEKIT_KEYS: '${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:7880']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.27.8
    container_name: scv-mailpit
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8025']
      interval: 15s
      timeout: 5s
      retries: 5

  # Opcional: docker compose --profile antivirus up -d clamav
  clamav:
    image: clamav/clamav:1.4
    container_name: scv-clamav
    profiles: ['antivirus']
    ports:
      - '${CLAMAV_PORT:-3310}:3310'

  # Opcional: docker compose --profile ocr up -d --build ocr-worker
  # Tesseract local (por+eng) + Poppler. A API segue no host.
  ocr-worker:
    build:
      context: ..
      dockerfile: infra/ocr/Dockerfile
    container_name: scv-ocr-worker
    profiles: ['ocr']
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://host.docker.internal:3000}
      INTERNAL_JOB_TOKEN: ${INTERNAL_JOB_TOKEN:-}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY deve ser definida no .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY deve ser definida no .env}
      S3_BUCKET: ${S3_BUCKET:-scv-dev}
      OCR_PROVIDER: tesseract
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKERS_PORT: 3001
    ports:
      - '${OCR_WORKER_PORT:-3002}:3001'
    depends_on:
      - redis
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
