name: CI

on:
  push:
    branches: [main, 'feat/**', 'cursor/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versão do pnpm vem de packageManager no package.json (evita conflito na action)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar cliente Prisma
        run: pnpm --filter @scv/prisma db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes (sem integração Prisma/Postgres)
        run: pnpm test --filter=!@scv/prisma

  migrations:
    name: Migrações em banco efêmero
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scv
          POSTGRES_PASSWORD: scv_ci_password
          POSTGRES_DB: scv_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scv -d scv_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://scv:scv_ci_password@localhost:5432/scv_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      # Versão do pnpm vem de packageManager no package.json (evita conflito na action)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar cliente Prisma
        run: pnpm --filter @scv/prisma db:generate

      - name: Aplicar migrações
        run: pnpm --filter @scv/prisma db:migrate:deploy

      - name: Seeds
        run: pnpm --filter @scv/prisma db:seed

  prisma-rls:
    name: Testes RLS e migração (Fase 2)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scv
          POSTGRES_PASSWORD: scv_ci_password
          POSTGRES_DB: scv_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scv -d scv_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://scv:scv_ci_password@localhost:5432/scv_ci?schema=public
      MIGRATION_DATABASE_URL: postgresql://scv:scv_ci_password@localhost:5432/scv_ci?schema=public
      RLS_DATABASE_URL: postgresql://scv_rls:scv_rls_password@localhost:5432/scv_ci?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar cliente Prisma
        run: pnpm --filter @scv/prisma db:generate

      - name: Testes de migração e isolamento RLS
        run: pnpm --filter @scv/prisma test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck-test, migrations, prisma-rls]
    steps:
      - uses: actions/checkout@v4

      # Versão do pnpm vem de packageManager no package.json (evita conflito na action)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  secrets-scan:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ocr-tesseract:
    name: OCR Tesseract local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar Tesseract, Poppler e fontes
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por tesseract-ocr-eng poppler-utils fonts-dejavu-core

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Qualidade do OCR local
        env:
          OCR_OBRIGATORIO: '1'
        run: pnpm exec turbo run test --filter=@scv/providers
